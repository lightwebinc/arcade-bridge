name: CI

on:
  push:
    # main only: a branch that has a PR is already covered by the
    # pull_request run, and a bare-branch push ran the whole matrix a
    # second time per PR (github.ref differs between the two events, so
    # the concurrency group cannot dedupe them).
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    uses: lightwebinc/ci/.github/workflows/go-host.yml@5e3a118fc997d254cbc49b9bf14c4fd3ec3974d0 # v0.7.2
    with:
      gofmt: true
      licences-check: true
