name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # weekly, Monday 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    # Code scanning uploads are rejected unless Code Security is enabled, which
    # is free on public repositories only.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pinned to the BUILDER toolchain, not the go.mod floor. The floor is
          # held at 1.26.2 fleet-wide on purpose; the shipped stdlib comes from
          # the Dockerfile builder (golang:1.27-alpine). go-version-file: go.mod
          # reads the floor, so it exercised a stdlib we never ship -- which
          # surfaced in vuln.yml as 10 stdlib advisories fixed in 1.26.x.
          go-version: "1.27.1"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:go"
